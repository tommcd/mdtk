[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtk"
dynamic = ["version"]
description = "Markdown Toolkit - Tools for working with markdown files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Tom McDermott", email = "tcmcdermott@gmail.com"},
]
keywords = ["markdown", "bookmarks", "chrome", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "beautifulsoup4",
]

[project.urls]
Documentation = "https://tommcd.github.io/mdtk"
Repository = "https://github.com/tommcd/mdtk"
Changelog = "https://github.com/tommcd/mdtk/releases"
Issues = "https://github.com/tommcd/mdtk/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools_scm]
version_file = "src/mdtk/_version.py"

[project.scripts]
mdtk-bookmarks = "mdtk.bookmarks:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310,py311,py312,py313,py314
isolated_build = True

[testenv]
extras = dev
commands =
    ruff check .
    ruff format --check .
    pytest {posargs:tests}
"""
